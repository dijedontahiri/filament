name: Diagnose issue 20519 baseline and candidate

on:
  push:
    branches:
      - diagnostic/20519-baseline-candidate-99dd

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'dijedontahiri/filament'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_SHA: 07481bdc4b6e47f9fc3d7ac8535dcf51dbd05610
      CANDIDATE_SHA: 99dd9d520f819acfb9590531751c754d5a72db77
    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 99dd9d520f819acfb9590531751c754d5a72db77
          fetch-depth: 0
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:13.*" "orchestra/testbench:11.*" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction

      - name: Capture baseline and candidate results
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          source_files=(
            packages/schemas/src/Components/Concerns/HasChildComponents.php
            packages/schemas/src/Components/Utilities/Get.php
          )
          for file in "${source_files[@]}"; do
            git show "$BASE_SHA:$file" > "$file"
          done
          set +e
          ./vendor/bin/pest --configuration=phpunit.sqlite.xml tests/src/Schemas/Components/Utilities/GetCastedStateTest.php --filter='returns cast state' > evidence/baseline.log 2>&1
          baseline_status=$?
          set -e
          git checkout "$CANDIDATE_SHA" -- "${source_files[@]}"
          set +e
          ./vendor/bin/pest --configuration=phpunit.sqlite.xml tests/src/Schemas/Components/Utilities/GetCastedStateTest.php > evidence/candidate.log 2>&1
          candidate_status=$?
          set -e
          {
            printf 'candidate_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'baseline_status=%s\n' "$baseline_status"
            printf 'candidate_status=%s\n' "$candidate_status"
            printf 'baseline_diff_files=%s\n' "$(git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" | tr '\n' ',')"
          } > evidence/summary.txt
          cat evidence/summary.txt
          printf '\n--- BASELINE ---\n'
          cat evidence/baseline.log
          printf '\n--- CANDIDATE ---\n'
          cat evidence/candidate.log

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: issue-20519-baseline-candidate
          path: evidence
          retention-days: 7

      - name: Verify candidate source restored
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git checkout "$CANDIDATE_SHA" -- packages/schemas/src/Components/Concerns/HasChildComponents.php packages/schemas/src/Components/Utilities/Get.php
          git diff --exit-code
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA"
